<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Infinity Corporation · ERP Médicos, Especialidades y Farmacias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7F6;
    --surface:#FFFFFF;
    --ink:#16302B;
    --ink-soft:#52685F;
    --ink-faint:#8CA098;
    --primary:#1F7A6C;
    --primary-dark:#0F2621;
    --primary-tint:#E4F0EC;
    --amber:#C97A1F;
    --amber-tint:#FBEEDD;
    --red:#B14A3D;
    --red-tint:#F7E7E3;
    --line:#DCE6E2;
    --sidebar:#0F2621;
    --sidebar-soft:#9FC2B8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Newsreader',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- layout ---------- */
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}

  .sidebar{
    background:var(--sidebar);
    color:#EAF3EF;
    padding:28px 20px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:#2A4A42 transparent;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:#2A4A42;border-radius:3px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:38px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    border:1.5px dashed var(--sidebar-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Newsreader',serif;font-style:italic;font-weight:600;
    font-size:16px;color:#EAF3EF;flex-shrink:0;
  }
  .brand-text{line-height:1.1;}
  .brand-text .name{font-family:'Newsreader',serif;font-size:19px;font-weight:600;}
  .brand-text .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sidebar-soft);}

  nav.modules{display:flex;flex-direction:column;gap:4px;margin-bottom:auto;}
  .nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#5C7C72;margin:14px 4px 8px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:8px;
    color:#CFE4DC;font-size:14px;font-weight:500;
    background:transparent;border:none;text-align:left;width:100%;
    transition:background .15s ease,color .15s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:#173832;color:#fff;}
  .nav-item.active{background:var(--primary);color:#fff;}

  .sidebar-foot{
    border-top:1px solid #1D3E37;padding-top:16px;margin-top:20px;
    font-size:12px;color:#6C8B81;line-height:1.5;
  }

  main{padding:36px 44px 60px;min-width:0;}

  .breadcrumb{
    font-size:12.5px;color:var(--ink-faint);margin-bottom:6px;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  }
  .breadcrumb button{background:none;border:none;color:var(--ink-faint);padding:0;font-size:12.5px;}
  .breadcrumb button:hover{color:var(--primary);text-decoration:underline;}
  .breadcrumb .sep{color:var(--line);}
  .breadcrumb .current{color:var(--ink-soft);font-weight:500;}

  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
  .page-head h1{font-size:29px;margin:0 0 4px;}
  .page-head p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:52ch;}

  .pulse{width:100%;height:34px;margin:6px 0 30px;opacity:.55;}
  .pulse path{fill:none;stroke:var(--primary);stroke-width:1.6;}

  /* ---------- specialty grid ---------- */
  .grid-specialties{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;
  }
  .spec-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 20px;text-align:left;position:relative;overflow:hidden;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .spec-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 20px -12px rgba(15,38,33,.35);}
  .spec-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);
  }
  .spec-icon{
    width:38px;height:38px;border-radius:9px;background:var(--primary-tint);
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  }
  .spec-icon svg{width:20px;height:20px;stroke:var(--primary-dark);}
  .spec-card h3{font-size:18px;margin:0 0 3px;}
  .spec-meta{font-size:12.5px;color:var(--ink-faint);}
  .spec-count{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--primary-dark);margin-top:14px;}
  .spec-count small{font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--ink-faint);font-weight:500;display:block;margin-top:2px;}

  /* ---------- doctor list ---------- */
  .grid-doctors{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .doc-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;display:flex;gap:14px;align-items:flex-start;text-align:left;
    transition:border-color .15s ease, transform .15s ease;
  }
  .doc-card:hover{border-color:var(--primary);transform:translateY(-2px);}
  .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--primary-dark);color:#EAF3EF;
    display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;
    font-weight:600;font-size:15px;flex-shrink:0;
  }
  .doc-info{min-width:0;}
  .doc-info h3{font-size:15.5px;margin:0 0 2px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .doc-info .role{font-size:12.5px;color:var(--primary-dark);margin-bottom:8px;}
  .doc-info .license{font-size:11.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
  .doc-stats{margin-top:10px;font-size:12px;color:var(--ink-soft);display:flex;gap:14px;}
  .doc-stats b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  /* ---------- Rx toolbar / pagination ---------- */
  .rx-toolbar{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .rx-search{
    flex:1 1 320px;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:var(--surface);color:var(--ink);
  }
  .rx-search:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
  .rx-count{font-size:12.5px;color:var(--ink-faint);white-space:nowrap;}
  .rx-pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:24px;}
  .pager-btn{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 16px;
    font-size:13px;color:var(--ink);font-weight:500;
  }
  .pager-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary-dark);}
  .pager-btn:disabled{opacity:.4;cursor:default;}
  .pager-info{font-size:12.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}

  /* ---------- Rx prescription cards ---------- */
  .rx-list{display:flex;flex-direction:column;gap:16px;}
  .rx-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:0;position:relative;overflow:hidden;
  }
  .rx-perf{
    height:10px;
    background-image:radial-gradient(circle,var(--bg) 2.3px,transparent 2.3px);
    background-size:14px 10px;background-position:2px center;
    border-bottom:1px dashed var(--line);
  }
  .rx-body{padding:18px 22px 20px;display:grid;grid-template-columns:1fr auto;gap:18px;}
  .rx-main .rx-code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;}
  .rx-main h4{font-size:16.5px;margin:3px 0 8px;font-family:'Newsreader',serif;font-weight:600;}
  .rx-diag{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .rx-meds{display:flex;flex-direction:column;gap:5px;}
  .rx-med{font-size:13px;display:flex;gap:7px;align-items:baseline;}
  .rx-med .dot{width:4px;height:4px;border-radius:50%;background:var(--primary);flex-shrink:0;}
  .rx-med .dose{color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .rx-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;text-align:right;}
  .rx-date{font-size:11.5px;color:var(--ink-faint);}
  .rx-view-btn{
    all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:8px 10px 7px;border:1px solid var(--line);border-radius:8px;background:#FBFCFC;
    transition:border-color .15s ease, background .15s ease;
  }
  .rx-view-btn:hover{border-color:var(--primary);background:var(--primary-tint);}
  .rx-view-btn svg{width:26px;height:30px;}
  .rx-view-btn span{font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--primary-dark);text-transform:uppercase;}
  .badge{
    font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;display:inline-block;
  }
  .badge.dispensada{background:var(--primary-tint);color:var(--primary-dark);}
  .badge.pendiente{background:var(--amber-tint);color:var(--amber);}

  /* ---------- receta digital (documento / modal) ---------- */
  .rx-modal-overlay{
    position:fixed;inset:0;background:rgba(15,38,33,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;overflow-y:auto;z-index:50;
  }
  .rx-modal-overlay[hidden]{display:none;}
  .rx-doc{
    position:relative;background:var(--surface);width:100%;max-width:560px;
    border-radius:14px;box-shadow:0 30px 60px -20px rgba(15,38,33,.45);
    padding:32px 36px 28px;
  }
  .rx-doc-close{
    all:unset;position:absolute;top:16px;right:18px;cursor:pointer;
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);font-size:14px;
  }
  .rx-doc-close:hover{background:var(--primary-tint);color:var(--primary-dark);}
  .rx-doc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--primary-dark);padding-bottom:14px;margin-bottom:18px;}
  .rx-doc-brand{display:flex;align-items:center;gap:9px;font-family:'Newsreader',serif;font-weight:600;font-size:15.5px;color:var(--primary-dark);}
  .rx-doc-brand small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}
  .brand-mark-sm{width:26px;height:26px;border-radius:50%;border:1.3px dashed var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .rx-doc-code{font-size:11.5px;color:var(--ink-faint);}
  .rx-doc-title{font-family:'Newsreader',serif;font-size:19px;font-weight:600;margin-bottom:18px;}
  .rx-doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px;}
  .rx-doc-grid .lbl,.rx-doc-diag .lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:3px;}
  .rx-doc-grid .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .rx-doc-diag{margin-bottom:20px;padding:12px 14px;background:#FBFCFC;border:1px dashed var(--line);border-radius:8px;}
  table.rx-doc-meds{width:100%;border-collapse:collapse;margin-bottom:22px;}
  table.rx-doc-meds th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--line);}
  table.rx-doc-meds td{padding:9px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  table.rx-doc-meds td:first-child{color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:11.5px;width:24px;}
  .rx-doc-foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:12px;}
  .rx-doc-qr{
    width:60px;height:60px;border-radius:6px;flex-shrink:0;
    background-image:
      linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 6px),
      linear-gradient(0deg,var(--ink) 0 3px,transparent 3px 6px);
    background-size:9px 9px;background-color:var(--surface);border:1px solid var(--line);
  }
  .rx-doc-sign{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .sign-scribble{width:150px;height:38px;}
  .sign-scribble path{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;}
  .sign-cursive{font-family:'Caveat',cursive;color:var(--ink);line-height:1;white-space:nowrap;display:inline-block;}
  .sign-block{display:flex;flex-direction:column;align-items:flex-end;}
  .sign-line{width:150px;border-top:1px solid var(--ink);margin-top:2px;}
  .sign-name{font-weight:600;font-size:12.5px;color:var(--ink);margin-top:5px;}
  .sign-meta{font-size:10.5px;color:var(--ink-faint);margin-bottom:6px;}
  .sign-verified{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--primary-dark);font-weight:600;margin-bottom:8px;}
  .sign-verified svg{width:12px;height:12px;}

  /* ---------- laboratorios clínicos ---------- */
  .lab-flag{font-weight:600;font-size:11px;padding:2px 8px;border-radius:12px;display:inline-block;}
  .lab-flag.normal{background:var(--primary-tint);color:var(--primary-dark);}
  .lab-flag.alto{background:var(--red-tint);color:var(--red);}
  .lab-flag.bajo{background:var(--amber-tint);color:var(--amber);}
  .lab-result-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .lab-result-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--line);}
  .lab-result-table td{padding:8px;font-size:12.5px;border-bottom:1px solid var(--line);}
  .lab-result-table td:first-child{font-weight:500;}
  .rx-doc-actions{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}

  /* ---------- pharmacy ---------- */
  .grid-pharm{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .pharm-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;text-align:left;
  }
  .pharm-card:hover{border-color:var(--primary);}
  .pharm-card h3{font-size:16.5px;margin:0 0 4px;}
  .pharm-addr{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;}
  .pharm-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px;}
  .pharm-foot b{font-family:'IBM Plex Mono',monospace;color:var(--ink);}

  table.purchases{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.purchases th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-faint);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBFCFC;
  }
  table.purchases td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.purchases tr:last-child td{border-bottom:none;}
  table.purchases .code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  table.purchases .meds{color:var(--ink-soft);font-size:12.5px;}
  table.purchases .amt{font-family:'IBM Plex Mono',monospace;text-align:right;}

  .card-btn{all:unset;cursor:pointer;display:block;}

  .empty-hint{font-size:12.5px;color:var(--ink-faint);margin-top:26px;}

  /* ---------- agente IA ---------- */
  .agent-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .viz-agent-pulse{animation:vizPulse 1s ease-in-out infinite;transform-origin:300px 150px;}
  @keyframes vizPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.7;transform:scale(1.06);}}
  .viz-line-active{stroke-dasharray:5 5;animation:vizFlow .6s linear infinite;}
  @keyframes vizFlow{to{stroke-dashoffset:-10;}}
  .viz-pharm-active{animation:vizFadeIn .4s ease;}
  @keyframes vizFadeIn{from{opacity:.3;}to{opacity:1;}}
  .agent-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .agent-stat .num{font-family:'IBM Plex Mono',monospace;font-size:26px;color:var(--primary-dark);}
  .agent-stat .lbl{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

  .agent-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:24px;}
  .agent-panel h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .agent-panel h3 svg{width:18px;height:18px;stroke:var(--primary);flex-shrink:0;}
  .agent-criteria{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:18px;}
  .agent-criteria li{list-style:none;font-size:12.5px;color:var(--ink-soft);display:flex;gap:8px;align-items:flex-start;}
  .agent-criteria li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0;}
  .agent-run-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .agent-run-btn{
    background:var(--primary-dark);color:#EAF3EF;border:none;border-radius:8px;padding:11px 20px;
    font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .agent-run-btn:hover{background:var(--primary);}
  .agent-run-btn svg{width:16px;height:16px;}
  .agent-run-note{font-size:12px;color:var(--ink-faint);}
  .farm-timer{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--primary-dark);background:var(--primary-tint);padding:6px 12px;border-radius:20px;white-space:nowrap;}
  .farm-timer svg{width:14px;height:14px;flex-shrink:0;}
  .auto-dot{width:8px;height:8px;border-radius:50%;background:#EAF3EF;display:inline-block;animation:autoPulse 1s ease-in-out infinite;}
  @keyframes autoPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .agent-log{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;}
  .agent-log-item{
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;
    display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    animation:agentFadeIn .35s ease;
  }
  @keyframes agentFadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .agent-log-code{font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);font-size:11.5px;}
  .agent-log-body b{font-weight:600;}
  .agent-log-reason{color:var(--ink-faint);font-size:11.5px;margin-top:2px;}
  .agent-log-pharm{font-size:11.5px;font-weight:600;color:var(--primary-dark);background:var(--primary-tint);padding:4px 10px;border-radius:20px;white-space:nowrap;}

  .queue-row{
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 16px;
  }
  .queue-list{display:flex;flex-direction:column;gap:8px;}
  .queue-main .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .queue-main .name{font-size:13.5px;font-weight:600;margin:2px 0;}
  .queue-main .meta{font-size:11.5px;color:var(--ink-soft);}
  .queue-btn{
    background:var(--surface);border:1px solid var(--primary);color:var(--primary-dark);
    border-radius:7px;padding:7px 13px;font-size:12px;font-weight:600;white-space:nowrap;
  }
  .queue-btn:hover{background:var(--primary);color:#fff;}

  /* ---------- consultas de pacientes (chat IA) ---------- */
  .patient-layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){ .patient-layout{grid-template-columns:1fr;} }
  .patient-side{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .patient-side h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 10px;}
  .chip-list{display:flex;flex-direction:column;gap:6px;}
  .chip-btn{
    all:unset;cursor:pointer;font-size:12.5px;color:var(--ink-soft);padding:8px 10px;border-radius:7px;
    border:1px solid var(--line);
  }
  .chip-btn:hover{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-dark);}

  .chat-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;}
  .chat-thread{padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:520px;overflow-y:auto;}
  .msg{display:flex;gap:10px;max-width:86%;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg-avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;
  }
  .msg.user .msg-avatar{
    width:auto;height:auto;border-radius:14px;padding:5px 10px;
    background:var(--primary-tint);color:var(--primary-dark);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;white-space:nowrap;
  }
  .msg.agent .msg-avatar{background:var(--primary-dark);color:#EAF3EF;}
  .msg-bubble{border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5;}
  .msg.agent .msg-bubble{background:#FBFCFC;border:1px solid var(--line);border-top-left-radius:3px;}
  .msg.user .msg-bubble{background:var(--primary-dark);color:#EAF3EF;border-top-right-radius:3px;}

  .stock-single{
    margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    background:var(--primary-tint);display:flex;flex-direction:column;gap:5px;
  }
  .stock-single-row{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;}
  .stock-single-row .lbl{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .stock-single-row .price{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--primary-dark);}

  .chat-inputbar{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:#FBFCFC;}
  .chat-inputbar input{
    flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;background:var(--surface);color:var(--ink);
  }
  .chat-inputbar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
  .chat-send-btn{background:var(--primary-dark);color:#EAF3EF;border:none;border-radius:8px;padding:0 18px;font-size:13px;font-weight:600;}
  .chat-send-btn:hover{background:var(--primary);}

  .rx-send-card{
    margin-top:10px;border:1px dashed rgba(234,243,239,.4);border-radius:8px;padding:9px 12px;
    background:rgba(234,243,239,.08);
  }
  .rx-send-code{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.85;}
  .rx-send-doc{font-size:12px;font-weight:600;margin-top:2px;}
  .rx-send-meds{font-size:11.5px;opacity:.85;margin-top:2px;}

  .patient-qr-card{margin-top:10px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);}
  .patient-qr-img{
    width:72px;height:72px;border-radius:6px;flex-shrink:0;
    background-image:
      linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px),
      linear-gradient(0deg,var(--ink) 0 4px,transparent 4px 8px);
    background-size:11px 11px;background-color:var(--bg);border:1px solid var(--line);
  }
  .patient-qr-info{flex:1;display:flex;flex-direction:column;gap:5px;}


  /* ---------- simulación multi-paciente (bandeja de entrada) ---------- */
  .ptabs{display:flex;gap:6px;margin-bottom:16px;}
  .ptab{all:unset;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-soft);padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);}
  .ptab:hover{border-color:var(--primary);color:var(--primary-dark);}
  .ptab.active{background:var(--primary-dark);color:#EAF3EF;border-color:var(--primary-dark);}
  .sim-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  @media (max-width:820px){ .sim-stats{grid-template-columns:repeat(2,1fr);} }
  .sim-stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .sim-stat .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--primary-dark);}
  .sim-stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-top:2px;}
  .sim-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
  .sim-toolbar .chip-btn{padding:9px 14px;}
  .sim-toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:var(--ink-soft);}
  .sim-live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .sim-live i{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);display:inline-block;}
  .sim-live.on i{background:#2E9B6A;animation:simPulse 1.2s infinite;}
  @keyframes simPulse{0%{box-shadow:0 0 0 0 rgba(46,155,106,.5);}100%{box-shadow:0 0 0 8px rgba(46,155,106,0);}}
  .sim-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;}
  @media (max-width:900px){ .sim-layout{grid-template-columns:1fr;} }
  .sim-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-y:auto;max-height:640px;}
  .sim-list-head{position:sticky;top:0;background:var(--surface);padding:12px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);border-bottom:1px solid var(--line);}
  .sim-item{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .sim-item:last-child{border-bottom:none;}
  .sim-item:hover{background:var(--primary-tint);}
  .sim-item.sel{background:var(--primary-tint);box-shadow:inset 3px 0 0 var(--primary);}
  .sim-av{width:34px;height:34px;border-radius:50%;background:var(--primary-dark);color:#EAF3EF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sim-item-body{flex:1;min-width:0;}
  .sim-phone{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--ink);}
  .sim-prev{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .sim-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .sim-status{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .st-wait{background:#FFF3DC;color:#8A5A00;}
  .st-typing{background:var(--primary-tint);color:var(--primary-dark);}
  .st-done{background:#E4F3EA;color:#1F6B47;}
  .st-idle{background:var(--bg);color:var(--ink-faint);}
  .sim-badge{min-width:18px;height:18px;border-radius:9px;background:#D64545;color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .sim-chat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:#FBFCFC;}
  .sim-chat-head .sim-phone{font-size:13.5px;}
  .sim-chat-head .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .typing-dots{display:inline-flex;gap:4px;padding:3px 0;}
  .typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:typeBounce 1s infinite;}
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes typeBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

  /* ---------- agente IA farmacias (simulación visual de verificación) ---------- */
  .scan-pharm-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}

  .scan-pharm-icon{
    width:38px;height:38px;border-radius:9px;background:var(--primary-tint);margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
  }
  .scan-pharm-card.scanning .scan-pharm-icon{background:var(--primary-dark);}
  .scan-pharm-icon svg{width:20px;height:20px;stroke:var(--primary-dark);}
  .scan-pharm-card.scanning .scan-pharm-icon svg{stroke:#EAF3EF;animation:scanSpin 1s linear infinite;}
  @keyframes scanSpin{ from{transform:rotate(0);} to{transform:rotate(360deg);} }
  .scan-pharm-name{font-size:12.5px;font-weight:600;margin-bottom:8px;line-height:1.3;}
  .scan-pharm-status{font-size:11px;color:var(--ink-faint);}
  .scan-pharm-status.status-scanning{color:var(--primary-dark);font-weight:600;}

  .scan-matrix{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .scan-matrix > div{background:var(--surface);padding:10px 12px;font-size:12px;display:flex;align-items:center;}
  .scan-med-label{font-weight:600;background:#FBFCFC !important;}
  .scan-pharm-head{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);background:#FBFCFC !important;justify-content:center;text-align:center;}
  .scan-cell{justify-content:center;text-align:center;}
  .scan-pending{color:var(--line);font-size:16px;}
  .scan-loading{
    width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;
    display:inline-block;animation:scanSpin .7s linear infinite;
  }
  .scan-ok{color:var(--primary-dark);font-weight:600;font-size:11.5px;animation:agentFadeIn .3s ease;}
  .scan-no{color:var(--red);font-weight:600;font-size:13px;animation:agentFadeIn .3s ease;}

  /* ---------- dashboard de ventas ---------- */
  .sales-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
  .sales-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .sales-kpi .num{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--primary-dark);}
  .sales-kpi .lbl{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .sales-chart-bar{fill:var(--primary);}
  .sales-chart-bar:hover{fill:var(--primary-dark);}
  .sales-chart-label{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--ink-faint);}
  .sales-chart-val{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:var(--ink-soft);}
  .sales-rank-row{display:grid;grid-template-columns:26px 1fr auto 110px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .sales-rank-row:last-child{border-bottom:none;}
  .sales-rank-idx{color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .sales-rank-amt{font-family:'IBM Plex Mono',monospace;color:var(--ink);white-space:nowrap;}
  .sales-rank-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
  .sales-rank-bar span{display:block;height:100%;background:var(--primary);border-radius:4px;}

  .stat-row{padding:12px 4px;border-bottom:1px solid var(--line);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row.sub{padding-left:26px;}
  .stat-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:13px;margin-bottom:6px;}
  .stat-row-label{color:var(--ink);}
  .stat-row.sub .stat-row-label{color:var(--ink-soft);font-size:12.5px;}
  .stat-row-amt{font-family:'IBM Plex Mono',monospace;color:var(--ink);white-space:nowrap;flex-shrink:0;}
  .stat-row-amt .pct{color:var(--ink-faint);}
  .stat-row-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
  .stat-row-bar span{display:block;height:100%;background:var(--primary);border-radius:4px;}
  .stat-row.sub .stat-row-bar span{background:var(--amber);}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:relative;height:auto;flex-direction:row;align-items:center;gap:18px;overflow-x:auto;}
    nav.modules{flex-direction:row;margin:0;}
    .sidebar-foot{display:none;}
    main{padding:26px 18px 50px;}
  }
</style>
</head>

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromString(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i)) | 0; }
  return h;
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }

function generateExtraPrescriptions(doctor, specId, need, startCode){
  const pool = CLINICAL_POOLS[specId];
  const rng = mulberry32(seedFromString(doctor.id));
  const out = [];
  for(let i=0;i<need;i++){
    const code = 'RX-2026-' + String(startCode + i).padStart(4,'0');
    let patient = `${pick(rng,FIRST_NAMES)} ${pick(rng,LAST_NAMES)}`;
    if(pool.pediatric){ patient += ` (${1 + Math.floor(rng()*11)} años)`; }
    const diagnosis = pick(rng, pool.diag);
    const medCount = 1 + Math.floor(rng()*2);
    const meds = []; const used = new Set();
    while(meds.length < medCount && used.size < pool.meds.length){
      const m = pick(rng, pool.meds);
      if(!used.has(m.n)){ used.add(m.n); meds.push(m); }
    }
    const status = rng() < 0.72 ? 'dispensada' : 'pendiente';
    const date = pick(rng, RX_DATES);
    out.push({ code, patient, date, diagnosis, meds, status });
  }
  return out;
}

(function fillOtherPharmacies(){
  const usedCodes = new Set();
  pharmacies.forEach(p=>p.purchases.forEach(pu=>usedCodes.add(pu.code)));

  const pool = [];
  specialties.filter(s=>s.id!=='medicina-general').forEach(spec=>{
    spec.doctors.forEach(doc=>{
      doc.prescriptions.forEach(rx=>{
        if(!usedCodes.has(rx.code)) pool.push({ rx, doc });
      });
    });
  });
  const shuffled = shuffleSeeded(pool, 'pharmacy-fill-seed');

  let idx = 0;
  pharmacies.forEach(p=>{
    if(p.purchases.length > 0) return; // no toca San Miguel ni Nueva Vida, que ya tienen datos curados
    const rngCount = mulberry32(seedFromString(p.id + '-count'));
    const count = 8 + Math.floor(rngCount() * 7); // entre 8 y 14 compras
    const items = shuffled.slice(idx, idx + count);
    idx += count;
    items.forEach(({rx, doc})=>{
      p.purchases.push({
        code: rx.code,
        patient: rx.patient,
        doctor: doc.name,
        date: rx.date,
        meds: rx.meds.map(m=>m.n).join(', '),
        total: 'Bs ' + priceForMeds(rx.code, rx.meds),
        status: rx.status,
      });
    });
  });
})();

function getStockListing(medName){
  const catalogItem = MED_CATALOG.find(m=>m.name===medName);
  if(!catalogItem) return null;
  const rng = mulberry32(seedFromString(medName + '-stock'));
  const results = [];
  pharmacies.forEach(p=>{
    if(rng() < 0.6){
      const variation = -8 + Math.floor(rng()*17);
      const price = Math.max(5, catalogItem.basePrice + variation);
      results.push({ pharmacy:p, price });
    }
  });
  results.sort((a,b)=>a.price-b.price);
  return { catalogItem, results };
}

function searchCatalog(query){
  const q = (query || '').toLowerCase().trim();
  if(!q) return [];
  return MED_CATALOG.filter(m => m.name.toLowerCase().includes(q) || m.brand.toLowerCase().includes(q));
}

function findPrescriptionByCode(code){
  let found = null;
  specialties.forEach(spec=>spec.doctors.forEach(doc=>doc.prescriptions.forEach(rx=>{
    if(rx.code.toLowerCase() === code.toLowerCase()) found = { rx, doc, spec };
  })));
  return found;
}

/* elige, para TODA la receta, la única farmacia que cubre el pedido completo al menor costo */
function getPharmacyForPrescription(rx){
  const byPharmacy = {};
  rx.meds.forEach(m=>{
    const catalogItem = MED_CATALOG.find(c=>c.name===m.n);
    if(!catalogItem) return;
    const listing = getStockListing(catalogItem.name);
    if(!listing) return;
    listing.results.forEach(r=>{
      const id = r.pharmacy.id;
      if(!byPharmacy[id]) byPharmacy[id] = { pharmacy:r.pharmacy, sum:0, count:0, perMed:[] };
      byPharmacy[id].sum += r.price;
      byPharmacy[id].count += 1;
      byPharmacy[id].perMed.push({ name:catalogItem.name, brand:catalogItem.brand, price:r.price });
    });
  });
  const totalMeds = rx.meds.length;
  const candidates = Object.values(byPharmacy);
  const complete = candidates.filter(c=>c.count===totalMeds).sort((a,b)=>a.sum-b.sum);
  if(complete.length>0) return { ...complete[0], complete:true };
  candidates.sort((a,b)=> b.count-a.count || a.sum-b.sum);
  return candidates[0] ? { ...candidates[0], complete:false } : null;
}

function answerPatientQuery(query){
  const matches = searchCatalog(query);
  if(matches.length === 0){
    const suggestions = shuffleSeeded(MED_CATALOG, 'sugg-' + query.toLowerCase()).slice(0,4).map(m=>m.name);
    return {
      text: `No encontré "${query}" en el catálogo de medicamentos de la red. ¿Quisiste decir alguno de estos?`,
      result: null, med: null, suggestions,
    };
  }
  const med = matches[0];
  const { results } = getStockListing(med.name);
  if(results.length === 0){
    return {
      text: `Encontré ${med.name} (${med.brand}) en el catálogo, pero ninguna farmacia de la red reporta stock disponible en este momento. Te recomiendo consultar nuevamente en unas horas.`,
      result: null, med, suggestions: null,
    };
  }
  const best = results[0];
  const text = `${med.name} está disponible en ${best.pharmacy.name} bajo la marca ${med.brand} (${med.presentation}), a un precio de Bs ${best.price}.`;
  return { text, result: best, med, suggestions: null };
}

function generateDentalPrescriptions(clinic, count){
  const rng = mulberry32(seedFromString(clinic.id + '-dentalrx'));
  const out = [];
  for(let i=0; i<count; i++){
    const code = `${clinic.id}-RX${i}`;
    const patient = `${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    const date = `${9 + Math.floor(rng()*13)} jul 2026`;
    const diagnosis = pick(rng, DENTAL_DIAG);
    const medCount = 1 + Math.floor(rng()*2);
    const meds = []; const used = new Set();
    while(meds.length < medCount && used.size < DENTAL_MEDS.length){
      const m = pick(rng, DENTAL_MEDS);
      if(!used.has(m.n)){ used.add(m.n); meds.push(m); }
    }
    const status = rng() < 0.72 ? 'dispensada' : 'pendiente';
    out.push({ code, patient, date, diagnosis, meds, status });
  }
  return out;
}

function buildDentalClinics(dept){
  const rng = mulberry32(seedFromString(dept + '-dental'));
  const count = 18 + Math.floor(rng() * 12); // 18 a 29
  const clinics = [];
  for(let i=0; i<count; i++){
    const type = rng() < 0.5 ? 'Clínica dental' : 'Consultorio dental';
    const base = pick(rng, DENTAL_NAME_BASES);
    const name = `${type} ${base} ${i+1}`;
    const street = pick(rng, DENTAL_STREETS);
    const address = `${street} #${100 + Math.floor(rng()*2900)}, ${dept}`;
    const dentist = `${rng()<0.5?'Dr.':'Dra.'} ${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    const patients = 31 + Math.floor(rng() * 13); // 31 a 43
    const clinic = { id:`dc-${dept}-${i}`, name, type, address, dentist, license:`ODT-${1000+Math.floor(rng()*8999)}-LP`, patients };
    clinic.prescriptions = generateDentalPrescriptions(clinic, patients);
    clinics.push(clinic);
  }
  return clinics;
}

/* ---------------- neurología por departamento (conteos variables por ciudad) ---------------- */
const NEURO_BIG_CITIES = ['La Paz', 'Santa Cruz', 'Cochabamba'];

function generateNeuroPrescriptions(doc, count){
  const pool = CLINICAL_POOLS['neurologia'];
  const rng = mulberry32(seedFromString(doc.id + '-rx'));
  const out = [];
  for(let i=0; i<count; i++){
    const code = `${doc.id}-RX${i}`;
    const patient = `${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    const date = `${9 + Math.floor(rng()*13)} jul 2026`;
    const diagnosis = pick(rng, pool.diag);
    const medCount = 1 + Math.floor(rng()*2);
    const meds = []; const used = new Set();
    while(meds.length < medCount && used.size < pool.meds.length){
      const m = pick(rng, pool.meds);
      if(!used.has(m.n)){ used.add(m.n); meds.push(m); }
    }
    const status = rng() < 0.72 ? 'dispensada' : 'pendiente';
    out.push({ code, patient, date, diagnosis, meds, status });
  }
  return out;
}

function buildNeuroDoctors(dept){
  const rng = mulberry32(seedFromString(dept + '-neuro'));
  const isBigCity = NEURO_BIG_CITIES.includes(dept);
  const count = isBigCity ? (8 + Math.floor(rng()*4)) : (3 + Math.floor(rng()*4)); // 8-11 o 3-6
  const docs = [];
  for(let i=0; i<count; i++){
    const title = rng() < 0.5 ? 'Dr.' : 'Dra.';
    const name = `${title} ${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    const patients = 76 + Math.floor(rng() * 13); // 76 a 88
    const doc = { id:`neuro-${dept}-${i}`, name, license:`MED-${1000+Math.floor(rng()*8999)}-LP`, dept, patients };
    doc.prescriptions = generateNeuroPrescriptions(doc, patients);
    docs.push(doc);
  }
  return docs;
}

const NEURO_DOCTORS_BY_DEPT = {};
MEDGEN_DEPARTMENTS.forEach(dept=>{ NEURO_DOCTORS_BY_DEPT[dept] = buildNeuroDoctors(dept); });

function neuroTotalDoctors(){
  return MEDGEN_DEPARTMENTS.reduce((a,d)=>a + NEURO_DOCTORS_BY_DEPT[d].length, 0);
}

const CITY_SPECIALTIES = {};

function generateCitySpecPrescriptions(specKey, doc, count){
  const pool = CLINICAL_POOLS[specKey];
  const rng = mulberry32(seedFromString(doc.id + '-rx'));
  const out = [];
  for(let i=0; i<count; i++){
    const code = `${doc.id}-RX${i}`;
    const patient = `${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    const date = `${9 + Math.floor(rng()*13)} jul 2026`;
    const diagnosis = pick(rng, pool.diag);
    const medCount = 1 + Math.floor(rng()*2);
    const meds = []; const used = new Set();
    while(meds.length < medCount && used.size < pool.meds.length){
      const m = pick(rng, pool.meds);
      if(!used.has(m.n)){ used.add(m.n); meds.push(m); }
    }
    const status = rng() < 0.72 ? 'dispensada' : 'pendiente';
    out.push({ code, patient, date, diagnosis, meds, status });
  }
  return out;
}

function registerCitySpecialty(key, displayName, iconKey, cityRange, otherRange){
  const doctorsByDept = {};
  MEDGEN_DEPARTMENTS.forEach(dept=>{
    const rng = mulberry32(seedFromString(dept + '-' + key));
    const isBig = NEURO_BIG_CITIES.includes(dept);
    const [cMin, cMax] = cityRange, [oMin, oMax] = otherRange;
    const count = isBig ? (cMin + Math.floor(rng()*(cMax-cMin+1))) : (oMin + Math.floor(rng()*(oMax-oMin+1)));
    const docs = [];
    for(let i=0; i<count; i++){
      const title = rng() < 0.5 ? 'Dr.' : 'Dra.';
      const name = `${title} ${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
      const patients = 76 + Math.floor(rng() * 13);
      const doc = { id:`${key}-${dept}-${i}`, name, license:`MED-${1000+Math.floor(rng()*8999)}-LP`, dept, patients };
      doc.prescriptions = generateCitySpecPrescriptions(key, doc, patients);
      docs.push(doc);
    }
    doctorsByDept[dept] = docs;
  });
  CITY_SPECIALTIES[key] = { displayName, iconKey, doctorsByDept };
}

function citySpecTotalDoctors(key){

function addExtraSpecDeptDoctors(specId, dept, count){
  const list = SPEC_DEPT_DATA[specId][dept];
  const startIdx = list.length;
  const rng = mulberry32(seedFromString(specId + '-' + dept + '-extra' + count + '-' + startIdx));
  for(let i=0; i<count; i++){
    const title = rng() < 0.5 ? 'Dr.' : 'Dra.';
    const name = `${title} ${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    const patients = 76 + Math.floor(rng() * 13); // 76 a 88
    const doc = { id:`${specId}-${dept}-${startIdx + i}`, name, license:`MED-${1000+Math.floor(rng()*8999)}-LP`, dept, patients };
    doc.prescriptions = generateSpecDeptPrescriptions(specId, doc, patients);
    list.push(doc);
  }
}

function specialtyStats(specId){
  if(specId === 'medicina-general'){
    let docs = 0, rx = 0;
    MEDGEN_DEPARTMENTS.forEach(d=>{
      const list = MEDGEN_DOCTORS_BY_DEPT[d];
      docs += list.length;
      list.forEach(doc=>{ rx += doc.patients; }); // 1 receta por paciente atendido
    });
    return { docs, rx };
  }
  if(SPEC_DEPT_IDS.includes(specId)){
    let docs = 0, rx = 0;
    MEDGEN_DEPARTMENTS.forEach(d=>{
      const list = SPEC_DEPT_DATA[specId][d];
      docs += list.length;
      list.forEach(doc=>{ rx += doc.prescriptions.length; });
    });
    return { docs, rx };
  }
  const spec = specialties.find(s=>s.id===specId);
  return { docs: spec.doctors.length, rx: spec.doctors.reduce((a,d)=>a+d.prescriptions.length, 0) };
}

  return `

/* ---------------- agente IA de enrutamiento ---------------- */
let agentLog = [];

function getRoutedCodesSet(){
  const set = new Set();
  pharmacies.forEach(p=>p.purchases.forEach(pu=>set.add(pu.code)));
  return set;
}
function getUnroutedQueue(){
  const routed = getRoutedCodesSet();
  const queue = [];
  specialties.forEach(spec=>{
    spec.doctors.forEach(doc=>{
      doc.prescriptions.forEach(rx=>{
        if(!routed.has(rx.code)) queue.push({ rx, doc, spec });
      });
    });
  });
  return queue;
}
function pickPharmacyForRx(code){
  const criteria = [
    'Balanceo de carga entre sucursales',
    'Historial de dispensación en esta especialidad',
    'Cercanía geográfica estimada por zona',
    'Disponibilidad de stock simulada',
  ];
  const rng = mulberry32(seedFromString(code + '-route'));
  const shortlist = shuffleSeeded(pharmacies, code + '-shortlist').slice(0, 6);
  shortlist.sort((a,b)=>a.purchases.length - b.purchases.length);
  return { chosen: shortlist[0], reason: pick(rng, criteria) };
}
function routeCode(code){
  let found = null;
  specialties.forEach(spec=>spec.doctors.forEach(doc=>doc.prescriptions.forEach(rx=>{
    if(rx.code === code) found = { rx, doc, spec };
  })));
  if(!found) return null;
  const { rx, doc, spec } = found;
  const { chosen, reason } = pickPharmacyForRx(code);
  chosen.purchases.push({
    code: rx.code, patient: rx.patient, doctor: doc.name, date: rx.date,
    meds: rx.meds.map(m=>m.n).join(', '), total: 'Bs ' + priceForMeds(rx.code, rx.meds), status: rx.status,
  });
  const entry = { code: rx.code, patient: rx.patient, doctor: doc.name, specialty: spec.name, pharmacy: chosen.name, reason };
  agentLog.unshift(entry);
  if(agentLog.length > 40) agentLog.length = 40;
  return entry;
}
function runAgentBatch(n){
  const queue = getUnroutedQueue();
  queue.slice(0, n).forEach(item => routeCode(item.rx.code));
  state.agentPage = 1;
  renderAgent();
}
function routeOneFromQueue(code){
  routeCode(code);
  renderAgent();
}

let autoRouteTimer = null;
function startAutoRouting(){
  state.agentAutoRunning = true;
  clearTimeout(autoRouteTimer);
  autoRouteStep();
  renderAgent();
}
function stopAutoRouting(){
  state.agentAutoRunning = false;
  clearTimeout(autoRouteTimer);
  renderAgent();
}
function autoRouteStep(){
  if(!state.agentAutoRunning || state.view !== 'agent') return;
  const queue = getUnroutedQueue();
  if(queue.length === 0){
    state.agentAutoRunning = false;
    renderAgent();
    return;
  }
  const batch = queue.slice(0, 3);
  batch.forEach(item => routeCode(item.rx.code));
  renderAgent();
  autoRouteTimer = setTimeout(autoRouteStep, 900);
}

function onAgentSearchInput(value){
  state.agentQuery = value;
  state.agentPage = 1;

function agentGoPage(delta){
  state.agentPage = (state.agentPage || 1) + delta;

}

function pharmInitials(name){
  return name.replace(/^Farmacia\s*/,'').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

function getVizPharmacyNames(){
  const seen = [];
  agentLog.forEach(l=>{ if(!seen.includes(l.pharmacy)) seen.push(l.pharmacy); });
  const names = seen.slice(0, 8);
  if(names.length < 8){
    pharmacies.forEach(p=>{ if(names.length < 8 && !names.includes(p.name)) names.push(p.name); });
  }
  return names;
}

function buildRoutingViz(){
  const names = getVizPharmacyNames();
  const recentSet = new Set(agentLog.slice(0, 3).map(l=>l.pharmacy));
  const cx = 300, cy = 150, r = 110;
  const nodes = names.map((name, i)=>{
    const angle = (i / names.length) * 2 * Math.PI - Math.PI/2;
    return { name, x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle), active: recentSet.has(name) };
  });
  const lines = nodes.map(n=>`<line x1="${cx}" y1="${cy}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="${n.active ? 'var(--primary)' : 'var(--line)'}" stroke-width="${n.active ? 2 : 1}" class="${n.active ? 'viz-line-active' : ''}"/>`).join('');
  const pharmNodes = nodes.map(n=>`
    <g class="${n.active ? 'viz-pharm-active' : ''}">
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="22" fill="${n.active ? 'var(--primary)' : 'var(--surface)'}" stroke="var(--line)" stroke-width="1.2"></circle>
      <text x="${n.x.toFixed(1)}" y="${(n.y+4).toFixed(1)}" text-anchor="middle" font-size="9" fill="${n.active ? '#fff' : 'var(--ink-soft)'}" font-family="IBM Plex Sans" font-weight="600">${pharmInitials(n.name)}</text>
      <text x="${n.x.toFixed(1)}" y="${(n.y+36).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--ink-faint)" font-family="IBM Plex Sans">${n.name.replace('Farmacia ','')}</text>
    </g>
  `).join('');
  const agentNode = `
    <circle cx="${cx}" cy="${cy}" r="34" fill="var(--primary-dark)" class="${state.agentAutoRunning ? 'viz-agent-pulse' : ''}"></circle>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="10" fill="#EAF3EF" font-family="IBM Plex Sans" font-weight="600">Agente</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="#EAF3EF" font-family="IBM Plex Sans" font-weight="600">IA</text>
  `;
  return `<svg viewBox="0 0 600 300" style="width:100%;height:auto;">${lines}${pharmNodes}${agentNode}</svg>`;
}

function renderAgentQueue(){
  const queue = getUnroutedQueue();
  const q = (state.agentQuery || '').toLowerCase().trim();
  const filtered = queue.filter(it =>
    !q || it.rx.patient.toLowerCase().includes(q) || it.doc.name.toLowerCase().includes(q) || it.rx.code.toLowerCase().includes(q)
  );
  const pageSize = 10;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const page = Math.min(Math.max(1, state.agentPage || 1), totalPages);
  state.agentPage = page;
  const start = (page - 1) * pageSize;
  const pageItems = filtered.slice(start, start + pageSize);

  document.getElementById('agentQueueList').innerHTML = pageItems.length ? pageItems.map(it=>`
    <div class="queue-row">
      <div class="queue-main">
        <div class="code">${it.rx.code}</div>
        <div class="name">${it.rx.patient}</div>
        <div class="meta">${it.doc.name} · ${it.spec.name} · ${it.rx.date}</div>
      </div>
      <button class="queue-btn" onclick="routeOneFromQueue('${it.rx.code}')">Enrutar con IA</button>
    </div>
  `).join('') : `<div class="empty-hint">No hay recetas pendientes de enrutar para "${state.agentQuery}".</div>`;

  document.getElementById('agentCount').textContent = q
    ? `${filtered.length.toLocaleString('es-BO')} de ${queue.length.toLocaleString('es-BO')} pendientes`
    : `${queue.length.toLocaleString('es-BO')} recetas pendientes de enrutar`;

  document.getElementById('agentPager').innerHTML = totalPages > 1 ? `
    <button class="pager-btn" onclick="agentGoPage(-1)" ${page<=1?'disabled':''}>← Anterior</button>
    <span class="pager-info">Página ${page} de ${totalPages}</span>
    <button class="pager-btn" onclick="agentGoPage(1)" ${page>=totalPages?'disabled':''}>Siguiente →</button>
  ` : '';
}

let patientChatLog = [];

function buildRxOrderDialogue(code){
  const found = findPrescriptionByCode(code);
  if(!found) return [];
  const { rx, doc, spec } = found;
  const order = getPharmacyForPrescription(rx);
  const msgs = [];

  msgs.push({ role:'user', type:'rx-send', text:'Te envío mi receta digital.', rx, doc, spec });
  msgs.push({ role:'agent', text:`Recibí y validé tu receta ${rx.code}, emitida por ${doc.name} (${spec.name}).` });

  msgs.push({ role:'user', text:'¿Cuál es el costo?' });
  if(order){
    const itemsText = order.perMed.map(m=>`${m.name} (${m.brand}) — Bs ${m.price}`).join(', ');
    msgs.push({ role:'agent', text:`El costo total de tu receta es Bs ${order.sum}. Incluye: ${itemsText}.` });
  } else {
    msgs.push({ role:'agent', text:'Por el momento ninguna farmacia de la red reporta stock para los medicamentos de esta receta.' });
  }

  msgs.push({ role:'user', text:'¿En qué farmacia encuentro?' });
  if(order){
    msgs.push({ role:'agent', text:`Puedes recogerla en ${order.pharmacy.name}, ${order.pharmacy.address}${order.complete ? ', que tiene todos los medicamentos en stock.' : ' (algunos medicamentos podrían gestionarse por encargo).'}` });
  } else {
    msgs.push({ role:'agent', text:'En este momento no tengo una farmacia con stock disponible para recomendarte.' });
  }

  msgs.push({ role:'user', text:'¿Me envía el QR para pagar y solo recoger?' });
  if(order){
    msgs.push({ role:'agent', type:'qr', text:`Claro. Aquí tienes tu código QR de pago — una vez pagado, solo debes mostrarlo en ${order.pharmacy.name} para recoger tu pedido, sin hacer fila en caja.`, order, rx });
  } else {
    msgs.push({ role:'agent', text:'Aún no puedo generar el QR porque no hay stock confirmado para esta receta.' });
  }
  return msgs;
}

  const input = document.getElementById('patientInput');
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  if(/^RX-2026-\d{4}$/i.test(val)){
    const found = findPrescriptionByCode(val);
    if(found){

      patientChatLog.push({ role:'user', text:val });
      patientChatLog.push({ role:'agent', text:`No encontré ninguna receta con el código ${val} en el sistema.` });

  patientChatLog.push({ role:'user', text:val });
  const ans = answerPatientQuery(val);
  patientChatLog.push({ role:'agent', text:ans.text, result:ans.result, med:ans.med, suggestions:ans.suggestions });
  renderPatientChat();
}

  const used = new Set(base.map(b=>b.phone));
  const rxCodes = ['RX-2026-0031','RX-2026-0037','RX-2026-0041','RX-2026-0048','RX-2026-0055'];
  const userAsk = ['Hola, ¿tienen {m}?', '¿Dónde consigo {m} y a qué precio?', 'Necesito {m}, ¿cuánto cuesta?', 'Buenas tardes, busco {m}'];
  while(base.length < 40){
    const phone = `+591 ${pick(rng,['6','7'])}${Math.floor(rng()*90+10)} ${String(Math.floor(rng()*90000+10000))}`;
    if(used.has(phone)) continue;
    used.add(phone);
    const kind = rng();
    const medName = pick(rng, MED_CATALOG).name;
    let script;
    if(kind < 0.25) script = buildRxOrderDialogue(pick(rng, rxCodes));
    else if(kind < 0.55) script = q(medName, pick(rng, userAsk).replace('{m}', medName));
    else if(kind < 0.8) script = [...q(medName, pick(rng, userAsk).replace('{m}', medName)), ...thanks];
    else script = [...hello, ...q(medName)];
    base.push({ phone, script });
  }
  return base;
}

function initSim(){
  if(sim) return;
  simReset(false);
}

function simReset(rerender){
  if(sim){ clearTimeout(sim.timer); sim.gen++; }
  const gen = sim ? sim.gen : 1;
  const speed = sim ? sim.speed : 2;
  const defs = buildSimConversations();
  const events = [];
  const maxLen = Math.max(...defs.map(d=>d.script.length));
  for(let t = 0; t < maxLen + defs.length; t++){
    defs.forEach((d,i)=>{ const k = t - Math.floor(i/3); if(k >= 0 && k < d.script.length) events.push({ c:i, m:d.script[k] }); });
  }
  sim = {
    convs: defs.map(d=>({ phone:d.phone, msgs:[], unread:0, typing:false })),
    events, idx:0, running:false, started:false, done:false, speed, selected:0,
    timer:null, pending:null, gen,
  };
  if(rerender){ sim.started = true; sim.running = true; renderPatients(); }
}

function simAlive(){ return !!document.getElementById('simThread') && patientTab === 'sim' && state.view === 'patients'; }

function simPush(ci, m){
  const conv = sim.convs[ci];
  conv.msgs.push(m);
  if(m.role === 'user' && ci !== sim.selected) conv.unread++;
}

function simStep(){
  if(!sim || !sim.running) return;
  if(!simAlive()){ simPause(); return; }
  if(sim.idx >= sim.events.length){ sim.running = false; sim.done = true; renderSimUI(); return; }
  const ev = sim.events[sim.idx++];
  const conv = sim.convs[ev.c];
  const sp = sim.speed, gen = sim.gen;
  if(ev.m.role === 'agent'){
    sim.pending = ev;
    conv.typing = true; renderSimUI();
    sim.timer = setTimeout(()=>{
      if(!sim || sim.gen !== gen || !simAlive()) return;
      sim.pending = null; conv.typing = false;
      simPush(ev.c, ev.m); renderSimUI();
      sim.timer = setTimeout(simStep, 700 / sp);
    }, 1100 / sp);
  } else {
    simPush(ev.c, ev.m); renderSimUI();
    sim.timer = setTimeout(simStep, 900 / sp);
  }
}

function simPause(){
  if(!sim) return;
  clearTimeout(sim.timer);
  if(sim.pending){ sim.idx--; sim.convs[sim.pending.c].typing = false; sim.pending = null; }
  sim.running = false;
}

function simToggle(){
  if(sim.done){ simReset(true); return; }
  if(sim.running){ simPause(); renderSimUI(); }
  else { sim.running = true; sim.started = true; renderSimUI(); simStep(); }
}

function simSetSpeed(v){ sim.speed = parseInt(v, 10) || 1; }

function simSelect(i){
  sim.selected = i;
  sim.convs[i].unread = 0;
  renderSimUI();
  const inp = document.getElementById('simInput');
  if(inp) inp.focus();
}

function simAgentReplies(ci, msgs){
  const gen = sim.gen, conv = sim.convs[ci];
  let k = 0;
  const next = ()=>{
    if(!sim || sim.gen !== gen || !simAlive() || k >= msgs.length){ if(conv) conv.typing = false; return; }
    conv.typing = true; renderSimUI();
    setTimeout(()=>{
      if(!sim || sim.gen !== gen || !simAlive()) return;
      conv.typing = false;
      simPush(ci, msgs[k++]); renderSimUI();
      setTimeout(next, 500);
    }, 1000 / sim.speed);
  };
  next();
}

function simAnswerFor(val){
  const rxm = val.match(/RX-2026-\d{4}/i);
  if(rxm){
    const code = rxm[0].toUpperCase();
    if(findPrescriptionByCode(code)){
      const d = buildRxOrderDialogue(code);
      return { userMsg: d[0], replies: d.filter(m=>m.role === 'agent') };
    }
    return { replies:[{ role:'agent', text:`No encontré ninguna receta con el código ${code} en el sistema.` }] };
  }
  if(/^(hola|buen[oa]s)/i.test(val)){
    return { replies:[{ role:'agent', text:'¡Hola! Soy el asistente de IA de la red de farmacias. Dime qué medicamento buscas o envíame el código de tu receta digital (RX-2026-XXXX).' }] };
  }
  if(/gracias/i.test(val)){
    return { replies:[{ role:'agent', text:'¡Con gusto! Si necesitas algo más, escríbeme cuando quieras.' }] };
  }
  const a = answerPatientQuery(val);
  return { replies:[{ role:'agent', text:a.text, result:a.result, med:a.med, suggestions:a.suggestions }] };
}

function simSubmit(){
  const inp = document.getElementById('simInput');
  const val = inp.value.trim();
  if(!val) return;
  inp.value = '';
  const ci = sim.selected;
  const ans = simAnswerFor(val);
  simPush(ci, ans.userMsg || { role:'user', text:val });
  renderSimUI();
  simAgentReplies(ci, ans.replies);
}

function simAsk(text){
  const ci = sim.selected;
  simPush(ci, { role:'user', text:`¿Dónde consigo ${text} y a qué precio?` });
  const a = answerPatientQuery(text);
  renderSimUI();
  simAgentReplies(ci, [{ role:'agent', text:a.text, result:a.result, med:a.med, suggestions:a.suggestions }]);
}

function simPreview(conv){
  const m = conv.msgs[conv.msgs.length - 1];
  if(!m) return 'Sin mensajes todavía';
  if(m.type === 'rx-send') return `Receta digital ${m.rx.code}`;
  if(m.type === 'qr') return 'Código QR de pago generado';
  return (m.role === 'agent' ? 'IA: ' : '') + m.text.replace(/<[^>]*>/g,'');
}

function simStatus(conv){
  if(conv.typing) return { cls:'st-typing', label:'IA escribiendo…' };
  const m = conv.msgs[conv.msgs.length - 1];
  if(!m) return { cls:'st-idle', label:'En espera' };
  if(m.role === 'user') return { cls:'st-wait', label:'Esperando IA' };
  return { cls:'st-done', label:'Atendido' };
}

function renderSimUI(){
  if(!sim || !document.getElementById('simThread')) return;
  const all = sim.convs.flatMap(c=>c.msgs);
  const stats = [
    { v: '49.243', l:'Conversaciones activas' },
    { v: all.filter(m=>m.role==='user').length, l:'Mensajes recibidos' },
    { v: all.filter(m=>m.role==='agent').length, l:'Respuestas del agente IA' },
    { v: all.filter(m=>m.type==='qr').length, l:'QR de pago generados' },
  ];
  document.getElementById('simStats').innerHTML = stats.map(s=>`<div class="sim-stat"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('');

  document.getElementById('simList').innerHTML = sim.convs.map((c,i)=>{
    const st = simStatus(c);
    return `
      <div class="sim-item ${i===sim.selected?'sel':''}" onclick="simSelect(${i})">
        <div class="sim-av">P${i+1}</div>
        <div class="sim-item-body">
          <div class="sim-phone">${c.phone}</div>
          <div class="sim-prev">${simPreview(c)}</div>
        </div>
        <div class="sim-meta">
          <span class="sim-status ${st.cls}">${st.label}</span>
          ${c.unread ? `<span class="sim-badge">${c.unread}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  const cur = sim.convs[sim.selected];
  const curSt = simStatus(cur);
  document.getElementById('simHeadPhone').textContent = cur.phone;
  document.getElementById('simHeadSub').textContent = `Canal de mensajería · ${curSt.label}`;
  document.getElementById('simInput').placeholder = `Escribe como ${cur.phone}… (medicamento o código RX-2026-XXXX)`;

  const thread = document.getElementById('simThread');
  const typingHtml = cur.typing ? `
    <div class="msg agent"><div class="msg-avatar">IA</div>
      <div class="msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div></div>` : '';
  thread.innerHTML = cur.msgs.length
    ? cur.msgs.map(m=>chatMsgHtml(m, cur.phone)).join('') + typingHtml
    : `<div style="color:var(--ink-faint);font-size:13px;text-align:center;padding:30px 0;">Este número aún no ha enviado mensajes.</div>` + typingHtml;
  thread.scrollTop = thread.scrollHeight;

  const btn = document.getElementById('simPlayBtn');
  btn.textContent = sim.done ? 'Repetir simulación' : (sim.running ? 'Pausar simulación' : (sim.idx ? 'Continuar simulación' : 'Iniciar simulación'));
  const live = document.getElementById('simLive');
  live.className = 'sim-live' + (sim.running ? ' on' : '');
  live.lastElementChild.textContent = sim.done ? 'Simulación finalizada' : (sim.running ? 'En vivo' : 'En pausa');
}

let farmCountdownTimer = null;
let farmCountdownValue = 10;

function startFarmCountdown(){
  clearInterval(farmCountdownTimer);
  farmCountdownValue = 10;
  farmCountdownTimer = setInterval(()=>{
    if(state.view !== 'agentfarm'){ clearInterval(farmCountdownTimer); return; }
    farmCountdownValue--;
    if(farmCountdownValue <= 0){
      const btn = document.getElementById('scanRunBtn');
      if(btn && !btn.hasAttribute('disabled')) runFarmacyScan();
      farmCountdownValue = 10;
    }
    updateFarmCountdownDisplay();
  }, 1000);
}
function updateFarmCountdownDisplay(){
  const el = document.getElementById('scanCountdownText');
  if(el) el.textContent = `Próxima consulta en ${farmCountdownValue}s`;
}

function runFarmacyScan(){
  const found = findPrescriptionByCode(state.farmRxCode);
  if(!found) return;
  const { rx } = found;
  const checkPharmacies = pharmacies.slice(0, 5);
  const btn = document.getElementById('scanRunBtn');
  if(btn) btn.setAttribute('disabled', '');
  document.getElementById('scanSummary').innerHTML = '';

  const stepDelay = 550;
  let stats = { checks: 0, available: 0, best: null };
  const realCount = rx.meds.length;
  const extraCount = EXTRA_MED_NAMES.length;
  const totalChecks = (realCount + extraCount) * checkPharmacies.length;
  const realDoneDelay = 500 + (checkPharmacies.length - 1) * 220 + (realCount - 1) * stepDelay + 450 + 100;

  checkPharmacies.forEach((p, ci)=>{
    const cardEl = document.getElementById(`scan-card-${p.id}`);
    const statusEl = document.getElementById(`scan-status-${p.id}`);
    setTimeout(()=>{
      if(cardEl) cardEl.classList.add('scanning');
      if(statusEl){ statusEl.textContent = 'Consultando base de datos…'; statusEl.classList.add('status-scanning'); }
    }, ci * 220);

    rx.meds.forEach((m, ri)=>{
      const delay = 500 + ci * 220 + ri * stepDelay;
      setTimeout(()=>{
        const cell = document.getElementById(`cell-${ri}-${ci}`);
        if(cell) cell.innerHTML = `<span class="scan-loading"></span>`;
        setTimeout(()=>{
          const listing = getStockListing(m.n);
          const hit = listing ? listing.results.find(r=>r.pharmacy.id === p.id) : null;
          stats.checks++;
          if(cell){
            cell.innerHTML = hit
              ? `<span class="scan-ok">✓ Bs ${hit.price}</span>`
              : `<span class="scan-no">✕</span>`;
          }
          if(hit){
            stats.available++;
            if(!stats.best || hit.price < stats.best.price) stats.best = { pharmacy:p, price:hit.price, med:m.n };
          }
          if(ri === realCount - 1){
            if(statusEl){
              const medsFound = rx.meds.filter(mm=>{
                const l = getStockListing(mm.n);
                return l && l.results.find(r=>r.pharmacy.id===p.id);
              }).length;
              statusEl.textContent = medsFound === realCount ? 'Receta completa disponible' : (medsFound>0 ? `${medsFound} de ${realCount} disponibles` : 'Sin stock');
              statusEl.classList.remove('status-scanning');
            }
            if(cardEl) cardEl.classList.remove('scanning');
          }
          if(stats.checks === totalChecks){
            setTimeout(()=>renderScanSummary(stats, rx, realCount + extraCount), 250);
            if(btn) btn.removeAttribute('disabled');
          }
        }, 450);
      }, delay);
    });

    // filas adicionales del catálogo: revelado rápido por lotes, sin animación de carga por celda
    EXTRA_MED_NAMES.forEach((name, ei)=>{
      const ri = realCount + ei;
      const delay = realDoneDelay + ei * 4;
      setTimeout(()=>{
        const cell = document.getElementById(`cell-${ri}-${ci}`);
        const price = genericStockCheck(name, p.id);
        stats.checks++;
        if(cell){
          cell.innerHTML = price !== null
            ? `<span class="scan-ok">✓ Bs ${price}</span>`
            : `<span class="scan-no">✕</span>`;
        }
        if(price !== null) stats.available++;
        if(stats.checks === totalChecks){
          setTimeout(()=>renderScanSummary(stats, rx, realCount + extraCount), 250);
          if(btn) btn.removeAttribute('disabled');
        }
      }, delay);
    });
  });
}

function renderScanSummary(stats, rx, totalMeds){
  const el = document.getElementById('scanSummary');
  if(!el) return;
  const n = totalMeds || rx.meds.length;
  el.innerHTML = `
    <div class="agent-panel">
      <h3>Resumen del agente</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0;">
        El agente revisó 5 farmacias (${stats.checks.toLocaleString('es-BO')} consultas sobre ${n.toLocaleString('es-BO')} medicamento${n===1?'':'s'}) y encontró ${stats.available.toLocaleString('es-BO')} coincidencia${stats.available===1?'':'s'} con stock.
        ${stats.best ? ` La mejor opción encontrada para la receta es <b>${stats.best.pharmacy.name}</b>, con ${stats.best.med} a Bs ${stats.best.price}.` : ' Ninguna de las 5 farmacias consultadas reportó stock disponible para los medicamentos de la receta.'}
      </p>
    </div>
  `;
}

function buildSalesData(periodId){
  const period = SALES_PERIODS[periodId] || SALES_PERIODS.p2;
  const total = period.total;
  const days = period.days;
  const r2 = n => Math.round(n * 100) / 100; // redondeo a centavos
  const rng = mulberry32(seedFromString('sales-dashboard-seed-' + period.id));
  const weights = pharmacies.map(p=>{
    const boost = (p.id==='p1' || p.id==='p2') ? 2.4 : 1;
    return (0.4 + rng()*1.6) * boost;
  });
  const sumW = weights.reduce((a,b)=>a+b,0);
  const pharmTotals = weights.map(w=>r2((w/sumW)*total));
  let diff = r2(total - pharmTotals.reduce((a,b)=>a+b,0));
  pharmTotals[0] = r2(pharmTotals[0] + diff);

  const dayPattern = period.dayPattern;
  const perDayByPharmacy = pharmacies.map((p,i)=>{
    const dayRng = mulberry32(seedFromString(p.id + '-days-' + period.id));
    const dw = dayPattern.map(b=>b*(0.85+dayRng()*0.3));
    const sdw = dw.reduce((a,b)=>a+b,0);
    const amounts = dw.map(w=>r2((w/sdw)*pharmTotals[i]));
    let d2 = r2(pharmTotals[i] - amounts.reduce((a,b)=>a+b,0));
    amounts[amounts.length-1] = r2(amounts[amounts.length-1] + d2);
    return amounts;
  });
  const dayTotals = days.map((_,di)=>r2(perDayByPharmacy.reduce((a,arr)=>a+arr[di],0)));
  return { period, days, total, pharmTotals, perDayByPharmacy, dayTotals };
}

function bs(n){
  const hasCents = Math.abs(n - Math.round(n)) > 0.004;
  return 'Bs ' + n.toLocaleString('es-BO', { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
}

const MED_CATEGORIES = ['Cardiología', 'Pediatría', 'Traumatología', 'Dermatología', 'Medicina General'];

/* usa el mismo total de ventas del módulo "Ventas de farmacias" y lo distribuye por tipo de medicamento */
function buildCategorySales(periodId){
  const period = SALES_PERIODS[periodId];
  const r2 = n => Math.round(n * 100) / 100;
  const rng = mulberry32(seedFromString('med-category-' + periodId));
  const weights = MED_CATEGORIES.map(()=> 0.5 + rng() * 1.5);
  const sumW = weights.reduce((a,b)=>a+b, 0);
  const amounts = MED_CATEGORIES.map((_,i)=> r2((weights[i]/sumW) * period.total));
  let diff = r2(period.total - amounts.reduce((a,b)=>a+b, 0));
  amounts[0] = r2(amounts[0] + diff);
  return MED_CATEGORIES.map((cat,i)=>({ category:cat, amount:amounts[i] }));
}

/* ---------------- medicamentos recetados por los médicos, por semana (datos reales) ---------------- */
const PRESCRIBED_REAL_WEEKS = ['Semana 1 (01–07 jul)', 'Semana 2 (08–14 jul)', 'Semana 3 (15–21 jul)'];
const PRESCRIBED_WEEK_DAYS = [7, 7, 7];
const PRESCRIBED_WEEKS = (()=>{
  const out = [...PRESCRIBED_REAL_WEEKS];
  const mon = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const dd = d => String(d.getDate()).padStart(2,'0');
  const end = new Date(2026, 9, 31);
  let start = new Date(2026, 6, 22), n = 4;
  while(start <= end){
    let e = new Date(start.getTime()); e.setDate(e.getDate() + 6);
    if(e > end) e = new Date(end.getTime());
    const days = Math.round((e - start) / 86400000) + 1;
    const label = start.getMonth() === e.getMonth()
      ? `${dd(start)}–${dd(e)} ${mon[e.getMonth()]}`
      : `${dd(start)} ${mon[start.getMonth()]} – ${dd(e)} ${mon[e.getMonth()]}`;
    out.push(`Semana ${n} (${label})`);
    PRESCRIBED_WEEK_DAYS.push(days);
    start = new Date(e.getTime()); start.setDate(start.getDate() + 1); n++;
  }
  return out;
})();

function weekBucketFromDate(dateStr){
  const day = parseInt(dateStr, 10);
  if(day <= 7) return 0;
  if(day <= 14) return 1;
  return 2;
}

function buildPrescribedByWeek(){
  const weeks = PRESCRIBED_REAL_WEEKS.map(()=>({ byCategory:{}, byMed:{}, total:0 }));
  MED_CATEGORIES.forEach(cat=> weeks.forEach(w=> w.byCategory[cat] = 0));
  specialties.forEach(spec=>{
    spec.doctors.forEach(doc=>{
      doc.prescriptions.forEach(rx=>{
        const wi = weekBucketFromDate(rx.date);
        const w = weeks[wi];
        rx.meds.forEach(m=>{
          w.byCategory[spec.name] = (w.byCategory[spec.name] || 0) + 1;
          w.byMed[m.n] = (w.byMed[m.n] || 0) + 1;
          w.total++;
        });
      });
    });
  });
  // Semanas posteriores al 21 jul: proyección determinista a partir de la última semana con recetas reales
  const base = weeks[2];
  const rng = mulberry32(seedFromString('prescribed-extended-weeks'));
  for(let k = 3; k < PRESCRIBED_WEEKS.length; k++){
    const f = (1 + 0.03 * (k - 2)) * (0.96 + rng() * 0.08) * (PRESCRIBED_WEEK_DAYS[k] / 7);
    const w = { byCategory:{}, byMed:{}, total:0 };
    MED_CATEGORIES.forEach(cat=>{
      w.byCategory[cat] = Math.round((base.byCategory[cat] || 0) * f * (0.97 + rng() * 0.06));
      w.total += w.byCategory[cat];
    });
    Object.entries(base.byMed).forEach(([name,c])=>{ w.byMed[name] = Math.round(c * f * (0.9 + rng() * 0.2)); });
    weeks.push(w);
  }
  return weeks;
}
