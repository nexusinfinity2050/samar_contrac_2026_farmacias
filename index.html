  { test:'Proteína C reactiva (PCR)', price:'Bs 40', params:[ { param:'PCR', unit:'mg/L', ref:'< 5' } ] },
];

function labRandValue(ref, flag, rng){
  if(ref.includes('–')){
    const [loS, hiS] = ref.split('–').map(s=>parseFloat(s.trim()));
    if(flag==='normal') return (loS + rng()*(hiS-loS)).toFixed(1);
    if(flag==='alto') return (hiS*(1.05+rng()*0.35)).toFixed(1);
    return (loS*(0.5+rng()*0.4)).toFixed(1);
  }
  if(ref.trim().startsWith('<')){
    const hi = parseFloat(ref.replace('<','').trim());
    return flag==='normal' ? (hi*(0.5+rng()*0.45)).toFixed(1) : (hi*(1.1+rng()*0.5)).toFixed(1);
  }
  if(ref.trim().startsWith('>')){
    const lo = parseFloat(ref.replace('>','').trim());
    return flag==='normal' ? (lo*(1.05+rng()*0.35)).toFixed(1) : (lo*(0.5+rng()*0.4)).toFixed(1);
  }
  return flag==='normal' ? 'Negativo' : 'Positivo';
}

function buildLabPatientPool(lab){
  const rng = mulberry32(seedFromString(lab.id + '-patients'));
  const pool = [];
  const used = new Set();
  while(pool.length < 10){
    const name = `${pick(rng, FIRST_NAMES)} ${pick(rng, LAST_NAMES)}`;
    if(!used.has(name)){ used.add(name); pool.push(name); }
  }
  return pool;
}

function generateLabOrders(lab, count, startCode, allDoctors, patientPool){
  const rng = mulberry32(seedFromString(lab.id + '-labfill'));
  const out = [];
  for(let i=0; i<count; i++){
    const code = 'LAB-2026-' + String(startCode + i).padStart(4,'0');
    const catalogItem = pick(rng, LAB_TEST_CATALOG);
    const patient = pick(rng, patientPool);
    const doctor = pick(rng, allDoctors);
    const day = 9 + Math.floor(rng()*13);
    const date = `${day} jul 2026`;
    const status = rng() < 0.68 ? 'completado' : 'pendiente';
    let results = null;
    if(status === 'completado'){
      results = catalogItem.params.map(p=>{
        const flag = rng() < 0.68 ? 'normal' : (rng() < 0.6 ? 'alto' : 'bajo');
        return { param:p.param, value: labRandValue(p.ref, flag, rng), unit:p.unit, ref:p.ref, flag };
      });
    }
    out.push({ code, patient, doctor, test:catalogItem.test, date, status, price:catalogItem.price, results });
  }
  return out;
}

(function fillLabOrders(){
  const allDoctors = [];
  specialties.forEach(spec=>spec.doctors.forEach(doc=>allDoctors.push(doc.name)));
  let nextCode = 104; // continúa después del último código curado (LAB-2026-0103)
  LABS.forEach(lab=>{
    lab.patientPool = buildLabPatientPool(lab);
    const extra = generateLabOrders(lab, 22, nextCode, allDoctors, lab.patientPool);
    nextCode += 22;
    lab.orders = lab.orders.concat(extra);
  });
})();

function goLabs(){
  state = { view:'labs' };
  setActiveNav('laboratorios');
  render();
}
function goLabOrders(labId){
  state = { view:'laborders', labId };
  setActiveNav('laboratorios');
  render();
}
function openLabModal(labId, code){
  const lab = LABS.find(l=>l.id===labId);
  const order = lab.orders.find(o=>o.code===code);
  document.getElementById('labDocContent').innerHTML = labDocumentHtml(lab, order);
  document.getElementById('labModal').removeAttribute('hidden');
}
function closeLabModal(){ document.getElementById('labModal').setAttribute('hidden',''); }
function closeLabModalOnBackdrop(e){ if(e.target.id === 'labModal') closeLabModal(); }

const LAB_TEST_META = {
  'Hemograma completo': { sample:'Sangre venosa (EDTA)', method:'Citometría de flujo / impedancia' },
  'Perfil lipídico': { sample:'Suero (ayuno de 12 h)', method:'Método enzimático colorimétrico' },
  'Glucosa en ayunas': { sample:'Suero (ayuno de 8 h)', method:'Enzimático (glucosa oxidasa)' },
  'Perfil renal': { sample:'Suero', method:'Cinético (Jaffé) / ureasa-UV' },
  'Perfil tiroideo': { sample:'Suero', method:'Inmunoensayo quimioluminiscente (CLIA)' },
  'Examen general de orina': { sample:'Orina, primera micción de la mañana', method:'Tira reactiva + microscopía' },
  'Proteína C reactiva (PCR)': { sample:'Suero', method:'Inmunoturbidimetría' },
};

function labInterpretiveNote(order){
  if(!order.results) return null;
  const abnormal = order.results.filter(r=>r.flag !== 'normal');
  if(abnormal.length === 0){
    return 'Todos los parámetros evaluados en este examen se encuentran dentro de los valores de referencia normales.';
  }
  const list = abnormal.map(r=>`${r.param} ${r.flag === 'alto' ? 'elevado' : 'disminuido'}`).join(', ');
  return `Se observan valores fuera del rango de referencia: ${list}. Se recomienda correlación clínica y seguimiento con el médico tratante.`;
}

function labDocumentHtml(lab, order){
  const meta = LAB_TEST_META[order.test] || { sample:'Según protocolo del examen', method:'Según protocolo del laboratorio' };
  const note = labInterpretiveNote(order);
  return `
    <button class="rx-doc-close" onclick="closeLabModal()">✕</button>
    <div class="rx-doc-head">
      <div class="rx-doc-brand"><span class="brand-mark-sm">NI</span><span>Nexus Infinity<small>Corporation · Red de laboratorios</small></span></div>
      <div class="rx-doc-code mono">${order.code}</div>
    </div>
    <div class="rx-doc-title">Informe de resultados de laboratorio</div>

    <div class="rx-doc-grid">
      <div><span class="lbl">Laboratorio</span><div>${lab.name}</div><div class="sub">${lab.address}</div></div>
      <div><span class="lbl">Paciente</span><div>${order.patient}</div><div class="sub">Médico solicitante: ${order.doctor}</div></div>
    </div>
    <div class="rx-doc-grid">
      <div><span class="lbl">Fecha de emisión</span><div>${order.date}</div><div class="sub">Tipo de muestra: ${meta.sample}</div></div>
      <div><span class="lbl">Examen solicitado</span><div>${order.test}</div><div class="sub">Método: ${meta.method}</div></div>
    </div>

    ${order.results ? `
      <table class="lab-result-table">
        <thead><tr><th>Parámetro</th><th>Resultado</th><th>Referencia</th><th>Estado</th></tr></thead>
        <tbody>
          ${order.results.map(r=>`
            <tr><td>${r.param}</td><td>${r.value} ${r.unit}</td><td>${r.ref}</td><td><span class="lab-flag ${r.flag}">${r.flag}</span></td></tr>
          `).join('')}
        </tbody>
      </table>
      <div class="rx-doc-diag" style="margin-top:14px;">
        <span class="lbl">Observación / interpretación</span>
        <div style="font-size:12.5px;">${note}</div>
      </div>
    ` : `<div class="empty-hint">Resultado aún pendiente de procesamiento. El informe se generará automáticamente al validarse en el laboratorio.</div>`}

    <div class="rx-doc-foot">
      <div class="rx-doc-qr" aria-hidden="true"></div>
      <div class="rx-doc-sign">

        <div class="sign-meta">Bioquímico responsable · ${lab.bioLic}</div>
        <span class="badge ${order.status==='completado'?'dispensada':'pendiente'}">${order.status==='completado'?'Validado':'Pendiente'}</span>
      </div>
    </div>
    <div class="empty-hint" style="margin-top:14px;">Este informe es de carácter referencial y debe ser interpretado por un profesional médico en el contexto clínico del paciente. Verificable con el código ${order.code} en el sistema Nexus Infinity.</div>
    <div class="rx-doc-actions">
      <button class="pager-btn" onclick="window.print()">Descargar / imprimir informe</button>
    </div>
  `;
}

/* ---------------- estadísticas de consultas de pacientes ---------------- */
function buildPatientQueryStats(){
  const totalPatients = specialties.reduce((a,s)=>a+s.doctors.reduce((b,d)=>b+d.patients,0), 0);
  const rng = mulberry32(seedFromString('patient-query-stats'));

  const noPricePct = 0.38 + rng()*0.08;
  const noPrice = Math.round(totalPatients * noPricePct);
  const askedPrice = totalPatients - noPrice;

  const askedLowest = Math.round(askedPrice * (0.50 + rng()*0.12));
  const askedBest = Math.round(askedPrice * (0.24 + rng()*0.12));
  const askedBrand = Math.round(askedPrice * (0.32 + rng()*0.14));
  const askedOrigin = Math.round(askedPrice * (0.15 + rng()*0.12));
  const askedIndia = Math.round(askedOrigin * (0.28 + rng()*0.16));

  return { totalPatients, noPrice, askedPrice, askedLowest, askedBest, askedBrand, askedOrigin, askedIndia };
}

const CAMERA_HOUR_BUCKETS = ['08:00–10:00','10:00–12:00','12:00–14:00','14:00–16:00','16:00–18:00','18:00–20:00'];

function distributeHours(total, seed){
  const rng = mulberry32(seedFromString(seed));
  const weights = CAMERA_HOUR_BUCKETS.map(()=> 0.5 + rng()*1.5);
  const sumW = weights.reduce((a,b)=>a+b, 0);
  const amounts = CAMERA_HOUR_BUCKETS.map((_,i)=> Math.round((weights[i]/sumW) * total));
  let diff = total - amounts.reduce((a,b)=>a+b, 0);
  amounts[0] += diff;
  return CAMERA_HOUR_BUCKETS.map((h,i)=>({ hour:h, count:amounts[i] }));
}

function buildCameraSupervisionStats(){
  const rng = mulberry32(seedFromString('camera-supervision'));
  const noRxCount = 600 + Math.floor(rng()*500);
  const thirdPartyCount = 300 + Math.floor(rng()*400);
  const avgAgeNoRx = (24 + rng()*20).toFixed(1);
  const avgAgeThirdParty = (32 + rng()*22).toFixed(1);
  const ownRxCount = pharmacies.reduce((a,p)=>a+p.purchases.length, 0);

  return {
    noRxCount, thirdPartyCount, avgAgeNoRx, avgAgeThirdParty, ownRxCount,
    noRxHours: distributeHours(noRxCount, 'camera-hours-norx'),
    thirdPartyHours: distributeHours(thirdPartyCount, 'camera-hours-thirdparty'),
    ownRxHours: distributeHours(ownRxCount, 'camera-hours-ownrx'),
  };
}

function cameraHourRows(hours, colorVar){
  const max = Math.max(...hours.map(h=>h.count));
  return hours.map(h=>`
    <div class="stat-row">
      <div class="stat-row-top">
        <span class="stat-row-label">${h.hour}</span>
        <span class="stat-row-amt">${h.count.toLocaleString('es-BO')}</span>
      </div>
      <div class="stat-row-bar"><span style="width:${(h.count/max*100).toFixed(1)}%;background:${colorVar};"></span></div>
    </div>
  `).join('');
}

function renderPatientStats(){
  const s = buildPatientQueryStats();
  const cam = buildCameraSupervisionStats();
  const pct = (n, base)=> base ? ((n/base)*100).toFixed(1) : '0.0';

  const rows = [
    { label:'No preguntaron el precio de los medicamentos de su receta', value:s.noPrice, base:s.totalPatients },
    { label:'Preguntaron el precio de los medicamentos de su receta', value:s.askedPrice, base:s.totalPatients },
    { label:'Preguntaron si existía un precio más bajo', value:s.askedLowest, base:s.askedPrice, sub:true },
    { label:'Preguntaron cuál es el mejor medicamento de su receta', value:s.askedBest, base:s.askedPrice, sub:true },
    { label:'Preguntaron la marca de los medicamentos de su receta', value:s.askedBrand, base:s.askedPrice, sub:true },
    { label:'Preguntaron la procedencia de los medicamentos de su receta', value:s.askedOrigin, base:s.askedPrice, sub:true },
    { label:'Preguntaron si la procedencia es India', value:s.askedIndia, base:s.askedOrigin, sub:true },
  ];
  const max = Math.max(...rows.map(r=>r.value));

  mainEl.innerHTML = `
    ${breadcrumb([{label:'Estadísticas de consultas'}])}
    <div class="page-head">
      <div>
        <h1>Estadísticas de consultas de pacientes</h1>
        <p>Comportamiento de los pacientes al consultar al agente de IA sobre los medicamentos de su receta digital.</p>
      </div>
    </div>

    <div class="agent-stats">
      <div class="agent-stat"><div class="num">${s.totalPatients.toLocaleString('es-BO')}</div><div class="lbl">Pacientes atendidos</div></div>
      <div class="agent-stat"><div class="num">${s.askedPrice.toLocaleString('es-BO')}</div><div class="lbl">Consultaron al agente (${pct(s.askedPrice, s.totalPatients)}%)</div></div>
      <div class="agent-stat"><div class="num">${s.noPrice.toLocaleString('es-BO')}</div><div class="lbl">No consultaron precio (${pct(s.noPrice, s.totalPatients)}%)</div></div>
    </div>

    <div class="agent-panel">
      <h3>Desglose de consultas</h3>
      ${rows.map(r=>`
        <div class="stat-row ${r.sub ? 'sub' : ''}">
          <div class="stat-row-top">
            <span class="stat-row-label">${r.label}</span>
            <span class="stat-row-amt">${r.value.toLocaleString('es-BO')} <span class="pct">(${pct(r.value, r.base)}%)</span></span>
          </div>
          <div class="stat-row-bar"><span style="width:${(r.value/max*100).toFixed(1)}%;"></span></div>
        </div>
      `).join('')}
      <p class="empty-hint" style="margin-top:16px;">Los porcentajes de las filas indentadas se calculan sobre la base de pacientes que sí preguntaron el precio (o, en el caso de "procedencia India", sobre quienes preguntaron por la procedencia). Un mismo paciente puede haber hecho más de una pregunta.</p>
    </div>

    <div class="page-head" style="margin-top:8px;">
      <div>
        <h1 style="font-size:22px;">Supervisión por cámara</h1>
        <p>Detección por videovigilancia en punto de venta: compras sin receta y compras con receta de un tercero.</p>
      </div>
    </div>

    <div class="agent-stats">
      <div class="agent-stat"><div class="num">${cam.noRxCount.toLocaleString('es-BO')}</div><div class="lbl">Personas que compran sin receta</div></div>
      <div class="agent-stat"><div class="num">${cam.avgAgeNoRx}</div><div class="lbl">Edad promedio · sin receta</div></div>
      <div class="agent-stat"><div class="num">${cam.thirdPartyCount.toLocaleString('es-BO')}</div><div class="lbl">Compran con receta de un tercero</div></div>
      <div class="agent-stat"><div class="num">${cam.avgAgeThirdParty}</div><div class="lbl">Edad promedio · receta de tercero</div></div>
    </div>

    <div class="grid-doctors" style="align-items:start;">
      <div class="agent-panel">
        <h3>Horarios · compras sin receta</h3>
        ${cameraHourRows(cam.noRxHours, 'var(--red)')}
      </div>
      <div class="agent-panel">
        <h3>Horarios · compras con receta de tercero</h3>
        ${cameraHourRows(cam.thirdPartyHours, 'var(--amber)')}
      </div>
    </div>

    <div class="agent-panel">
      <h3>Horarios · compras con receta propia <span style="font-weight:400;color:var(--ink-faint);font-size:12px;">— ${cam.ownRxCount.toLocaleString('es-BO')} compras registradas</span></h3>
      ${cameraHourRows(cam.ownRxHours, 'var(--primary)')}
      <p class="empty-hint" style="margin-top:14px;">Los conteos de esta sección provienen de cámaras de videovigilancia en punto de venta, como control complementario a los registros digitales de recetas.</p>
    </div>
  `;
}
